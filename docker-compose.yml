# Single-node compose setup — SQLite requires ONE writer process.
# Do NOT scale this service above 1 replica.
services:
  app:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_PATH: /app/data/autoauction.db
      DOCUMENTS_DIR: /app/data/documents
      APP_BASE_URL: http://localhost:3100
      EMAIL_TRANSPORT: webhook
      # EMAIL_WEBHOOK_URL: https://your-mail-endpoint
      SESSION_COOKIE_NAME: aa_session
    volumes:
      - aa-data:/app/data            # database + backups + private documents
      - aa-uploads:/app/public/uploads  # public vehicle images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aa-data:
  aa-uploads:
