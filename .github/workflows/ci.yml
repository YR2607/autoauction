name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build before tests: the HTTP suite spawns `next start` against a
      # throwaway file database in tests/tmp — mirroring production.
      - name: Build
        run: pnpm build
        env:
          DATABASE_PATH: ${{ github.workspace }}/tests/tmp/ci-build.db

      # Vitest uses :memory: for unit suites and tests/tmp for HTTP —
      # never touches any real database. No secrets required.
      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose interpolation reads .env — provide the placeholder example.
      - name: Validate docker-compose configuration
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Docker build with synthetic public config
        run: docker build --build-arg NEXT_PUBLIC_CONTACT_EMAIL=ci-contact@example.dev -t autoauction:ci .

      # The build-time NEXT_PUBLIC_ value must land in the client bundle.
      - name: Verify build-time contact email is in the image
        run: |
          docker run --rm --entrypoint sh autoauction:ci -c \
            "grep -rq 'ci-contact@example.dev' /app/.next && echo 'contact email baked into bundle'"
